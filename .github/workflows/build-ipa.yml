name: Build unsigned IPA (iOS 16)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios16-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SwingMusicApp.xcodeproj \
            -scheme SwingMusicApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SwingMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.4 \
            -skipPackagePluginValidation \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Package IPA
        run: |
          set -e
          APP="$(find "$RUNNER_TEMP/SwingMusic.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle found in archive"
            find "$RUNNER_TEMP/SwingMusic.xcarchive" -maxdepth 6 -type d -name '*.app' || true
            exit 1
          fi
          echo "Packaging: $APP"
          rm -rf "$RUNNER_TEMP/payload"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          find "$RUNNER_TEMP/payload/Payload" -type d -name '_CodeSignature' -exec rm -rf {} + 2>/dev/null || true
          LDID="$(brew --prefix)/bin/ldid"
          find "$RUNNER_TEMP/payload/Payload" -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              "$LDID" -S "$f" || true
            fi
          done
          cd "$RUNNER_TEMP/payload"
          zip -qry "$RUNNER_TEMP/SwingMusic-ios16-unsigned.ipa" Payload
          ls -lh "$RUNNER_TEMP/SwingMusic-ios16-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwingMusic-ios16-unsigned
          path: ${{ runner.temp }}/SwingMusic-ios16-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
          retention-days: 7
